server {
    listen 8301;
    # Docker resolves `localhost` inside a container to ::1 first, so an
    # IPv4-only listener answers from outside but refuses its own health check.
    listen [::]:8301;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed asset filenames — safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Docker's embedded DNS. Without an explicit resolver nginx looks the
    # upstream up once at startup and caches the IP forever, so every rebuild of
    # the api container leaves the dashboard serving 502s until nginx restarts.
    # A variable in proxy_pass is what forces the lookup to happen per request.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Same-origin proxy to horizon-api, so the browser never needs CORS.
    location /api/ {
        set $api_host api;
        proxy_pass http://$api_host:8300$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location = /health {
        set $api_host api;
        proxy_pass http://$api_host:8300/health;
    }

    # The shell must never be cached, because it is the only thing that names
    # which hashed bundle to load — and those are cached immutable for a year.
    # Without this a browser keeps a stale index.html under heuristic freshness
    # (no Cache-Control means it may guess), goes on loading the bundle that
    # shell names, and every deploy silently reaches nobody who has visited
    # before. It reads as "the feature was never built".
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Client-side routing: unknown paths fall back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
