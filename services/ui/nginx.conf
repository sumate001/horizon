server {
    listen 8301;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed asset filenames — safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Same-origin proxy to horizon-api, so the browser never needs CORS.
    location /api/ {
        proxy_pass http://api:8300/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://api:8300/health;
    }

    # Client-side routing: unknown paths fall back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
