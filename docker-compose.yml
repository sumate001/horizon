# Horizon — News Intelligence Pipeline
#
# Fully separate Docker stack from OSINT//DESK (project `osintdesk`): its own
# compose project, network, volumes, postgres, redis and qdrant. The two systems
# talk over HTTP webhooks only — never over a shared network or database.
#
# Host ports are offset so both stacks run side by side on one machine:
#   horizon   postgres 5433  redis 6380  qdrant 6343  api 8300  ui 8301
#   osintdesk nginx 80/443   api 8000    neo4j 7474/7687  (pg/redis not exposed)
#
# Phases 1, 2, 3 and (early) 5:
# poller / worker / batch / reasoner / api / ui.

name: horizon

x-app: &app
  build:
    context: .
  image: horizon-app:latest
  env_file: .env
  restart: unless-stopped
  networks: [horizon]
  # Lets the reasoner reach OSINT//DESK on the host (OSINT_DESK_BASE_URL=
  # http://host.docker.internal:8000) without joining its network.
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    qdrant:
      condition: service_started

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-horizon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-horizon}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-horizon} -d ${POSTGRES_DB:-horizon}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [horizon]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [horizon]

  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes:
      - qdrantdata:/qdrant/storage
    ports:
      - "6343:6333"
    restart: unless-stopped
    networks: [horizon]
    # Qdrant mmaps several files per segment and holds them open. Docker's
    # default soft limit of 1024 is well under what it needs: once exhausted it
    # stops accepting connections entirely with "Too many open files (os error
    # 24)" while still looking healthy from the outside.
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Runs migrations + seed once, then exits. Everything else waits on it.
  migrate:
    <<: *app
    restart: "no"
    command: ["sh", "-c", "alembic upgrade head && python -m horizon.seed"]

  api:
    <<: *app
    command: ["uvicorn", "horizon.services.api:app", "--host", "0.0.0.0", "--port", "8300"]
    ports:
      - "8300:8300"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8300/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Background services have no request surface, so their metrics endpoint
  # doubles as the liveness probe: if the event loop is wedged, it stops
  # answering and the container is reported unhealthy instead of quietly idle.
  poller:
    <<: *app
    command: ["python", "-m", "horizon.services.poller"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9101/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    <<: *app
    command: ["python", "-m", "horizon.services.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9102/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  batch:
    <<: *app
    command: ["python", "-m", "horizon.services.batch"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9103/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Clustering on a full window can hold the loop for minutes on first run.
      start_period: 300s

  reasoner:
    <<: *app
    command: ["python", "-m", "horizon.services.reasoner"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9104/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  ui:
    build:
      context: ./services/ui
    image: horizon-ui:latest
    restart: unless-stopped
    networks: [horizon]
    ports:
      - "8301:8301"
    depends_on:
      - api
    healthcheck:
      # 127.0.0.1, not localhost: the latter resolves to ::1 first in a container.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8301/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  horizon:
    name: horizon_net

volumes:
  pgdata:
  redisdata:
  qdrantdata:
